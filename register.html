<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration - Kabarak University</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header>
        <h1>Kabarak University</h1>
        <p>Student Registration Form</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="timetable.html">Timetable</a>
        <a href="register.html">Registration</a>
    </nav>

    <main>

        <h2>Student Registration</h2>

        <form id="registration-form" action="#" method="get" novalidate>

            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age">

            </fieldset>

            <fieldset>
                <legend>Academic Information</legend>

                <label for="course">Course:</label>
                <select id="course" name="course">
                    <option value="">Select Course</option>
                    <option value="Data Science and Analytics">
                        Data Science and Analytics
                    </option>
                    <option value="Business Administration">
                        Business Administration
                    </option>
                    <option value="Computer Science">
                        Computer Science
                    </option>
                    <option value="Information Technology">
                        Information Technology
                    </option>
                </select>

                <label for="year">Year of Study:</label>
                <select id="year" name="year">
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>
                </select>

            </fieldset>
            
            <fieldset>
                <legend>Additional Information</legend>

                <label for="comments">Comments:</label>
                <textarea id="comments" name="comments"></textarea>

                <label>
                    <input type="checkbox" name="declaration" required>
                    I confirm that the information provided is correct.
                </label>

            </fieldset>

            <button type="submit">Register</button>
            <button type="reset">Clear Form</button>

        </form>

    </main>

    <footer>
        <p>&copy; 2026 Kabarak University. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
